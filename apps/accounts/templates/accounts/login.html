{% extends 'base.html' %}

{% block title %}Acesso ao Aluno - IMUTÁVEL FIRE{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h3 class="fw-bold text-danger">🔥 IMUTÁVEL FIRE</h3>
                    <p class="text-muted small">Plataforma de Ensino e Credenciamento</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_username" class="form-label font-weight-bold">Usuário / CPF</label>
                        <input type="text" name="username" class="form-control" id="id_username" placeholder="Digite seu usuário" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="id_password" class="form-label font-weight-bold">Senha</label>
                        <input type="password" name="password" class="form-control" id="id_password" placeholder="Digite sua senha" required>
                    </div>

                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-danger btn-lg fs-6 fw-bold">ENTRAR NA PLATAFORMA</button>
                    </div>
                </form>
            </div>
            <div class="card-footer bg-light text-center py-3">
                <small class="text-muted">Esqueceu sua senha? Entre em contato com o suporte.</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
