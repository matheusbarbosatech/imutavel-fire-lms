{% extends 'base.html' %}
{% block title %}Acesso - IMUTÁVEL FIRE{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5">
        <div class="card shadow-lg border-0 rounded-4 p-4">
            <div class="text-center mb-4">
                <h3 class="fw-bold text-danger"><i class="bi bi-fire"></i> IMUTÁVEL FIRE</h3>
                <p class="text-muted">Acesse sua plataforma de treinamentos operacionais</p>
            </div>

            <!-- Formulário de Login -->
            <form method="post" action="{% url 'accounts:login' %}">
                {% csrf_token %}
                
                <div class="mb-3">
                    <label class="form-label fw-semibold">E-mail de Acesso</label>
                    <input type="email" name="username" class="form-control form-control-lg" required placeholder="seu@email.com">
                </div>

                <div class="mb-4">
                    <div class="d-flex justify-content-between align-items-center">
                        <label class="form-label fw-semibold mb-0">Senha</label>
                        <!-- Link de Esqueci a Senha -->
                        <a href="{% url 'password_reset' %}" class="text-decoration-none text-danger small fw-semibold">
                            Esqueceu a senha?
                        </a>
                    </div>
                    <input type="password" name="password" class="form-control form-control-lg mt-2" required placeholder="Digite sua senha secreta">
                </div>

                <button type="submit" class="btn btn-danger btn-lg w-100 fw-bold shadow-sm mb-3">
                    <i class="bi bi-box-arrow-in-right me-2"></i> Entrar na Plataforma
                </button>
            </form>

            <hr class="text-muted">

            <!-- Link de Cadastro -->
            <div class="text-center mt-3">
                <span class="text-muted">Ainda não é aluno?</span>
                <a href="{% url 'accounts:register' %}" class="text-danger fw-bold text-decoration-none">
                    Cadastre-se grátis
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
