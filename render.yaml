services:
  - type: web
    name: sistema-matricula
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    envVars:
      # ===== PYTHON =====
      - key: PYTHON_VERSION
        value: "3.11"
      
      # ===== DJANGO =====
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      
      # ===== BANCO DE DADOS (Supabase) =====
      # ✅ Porta 6543 = Connection Pooling (mais estável para Render)
      - key: DB_NAME
        value: "postgres"
      - key: DB_USER
        value: "postgres"
      - key: DB_PASSWORD
        value: "SenhaMatricula2026!"
      - key: DB_HOST
        value: "db.taddgzgbgstttecbvkmc.supabase.co"
      - key: DB_PORT
        value: "6543"
      
      # ===== E-MAIL (Brevo) =====
      - key: EMAIL_HOST
        value: "smtp-relay.brevo.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      
      # ===== STORAGE (Supabase) =====
      - key: SUPABASE_URL
        value: "https://taddgzgbgstttecbvkmc.supabase.co"
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: "matricula-docs"